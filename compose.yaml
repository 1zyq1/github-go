services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: github-accelerator:local
    ports:
      - "8000:8000"
    environment:
      GITHUB_ACCELERATOR_STATIC_DIR: /app/frontend/dist
      GITHUB_ACCELERATOR_MAX_CONCURRENT_PROXIES: "64"
      GITHUB_ACCELERATOR_MAX_CONNECTIONS: "128"
      GITHUB_ACCELERATOR_MAX_KEEPALIVE_CONNECTIONS: "32"
      GITHUB_ACCELERATOR_PROXY_QUEUE_TIMEOUT_SECONDS: "10"
      GITHUB_ACCELERATOR_CONNECT_TIMEOUT_SECONDS: "10"
      GITHUB_ACCELERATOR_READ_TIMEOUT_SECONDS: "300"
      GITHUB_ACCELERATOR_POOL_TIMEOUT_SECONDS: "10"
      GITHUB_ACCELERATOR_ARCHIVE_CACHE_DIR: /app/.cache/archives
      GITHUB_ACCELERATOR_ARCHIVE_CACHE_MAX_BYTES: "21474836480"
      # The account store lives in MySQL rather than in the cache volume, so the
      # connection has to be configured or the app refuses to start.
      GITHUB_ACCELERATOR_MYSQL_HOST: ${GITHUB_ACCELERATOR_MYSQL_HOST:-127.0.0.1}
      GITHUB_ACCELERATOR_MYSQL_PORT: ${GITHUB_ACCELERATOR_MYSQL_PORT:-3306}
      GITHUB_ACCELERATOR_MYSQL_USER: ${GITHUB_ACCELERATOR_MYSQL_USER:-}
      GITHUB_ACCELERATOR_MYSQL_PASSWORD: ${GITHUB_ACCELERATOR_MYSQL_PASSWORD:-}
      GITHUB_ACCELERATOR_MYSQL_DATABASE: ${GITHUB_ACCELERATOR_MYSQL_DATABASE:-}
      GITHUB_ACCELERATOR_MYSQL_TABLE_PREFIX: ${GITHUB_ACCELERATOR_MYSQL_TABLE_PREFIX:-}
      GITHUB_ACCELERATOR_MYSQL_POOL_MIN_SIZE: ${GITHUB_ACCELERATOR_MYSQL_POOL_MIN_SIZE:-1}
      GITHUB_ACCELERATOR_MYSQL_POOL_MAX_SIZE: ${GITHUB_ACCELERATOR_MYSQL_POOL_MAX_SIZE:-10}
      # Read from the project .env through interpolation, so one file configures
      # both this container and a plain uvicorn run. Each value falls back to a
      # safe default, which keeps the app running in log-only mode when no mail
      # transport is configured.
      GITHUB_ACCELERATOR_PUBLIC_BASE_URL: ${GITHUB_ACCELERATOR_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      GITHUB_ACCELERATOR_VERIFICATION_TTL_SECONDS: ${GITHUB_ACCELERATOR_VERIFICATION_TTL_SECONDS:-86400}
      GITHUB_ACCELERATOR_VERIFICATION_RESEND_SECONDS: ${GITHUB_ACCELERATOR_VERIFICATION_RESEND_SECONDS:-60}
      GITHUB_ACCELERATOR_SMTP_HOST: ${GITHUB_ACCELERATOR_SMTP_HOST:-}
      GITHUB_ACCELERATOR_SMTP_PORT: ${GITHUB_ACCELERATOR_SMTP_PORT:-587}
      GITHUB_ACCELERATOR_SMTP_USERNAME: ${GITHUB_ACCELERATOR_SMTP_USERNAME:-}
      GITHUB_ACCELERATOR_SMTP_PASSWORD: ${GITHUB_ACCELERATOR_SMTP_PASSWORD:-}
      GITHUB_ACCELERATOR_SMTP_FROM: ${GITHUB_ACCELERATOR_SMTP_FROM:-}
      GITHUB_ACCELERATOR_SMTP_STARTTLS: ${GITHUB_ACCELERATOR_SMTP_STARTTLS:-true}
      # Cross-site SSO with the 1zyq1 blog. The secret is shared with the blog's
      # backend; leaving it empty disables SSO (the button is hidden).
      GITHUB_ACCELERATOR_SSO_SHARED_SECRET: ${GITHUB_ACCELERATOR_SSO_SHARED_SECRET:-}
      GITHUB_ACCELERATOR_SSO_ISSUER: ${GITHUB_ACCELERATOR_SSO_ISSUER:-github-accelerator}
      GITHUB_ACCELERATOR_SSO_AUDIENCE: ${GITHUB_ACCELERATOR_SSO_AUDIENCE:-blog}
      GITHUB_ACCELERATOR_SSO_PEER_AUTHORIZE_URL: ${GITHUB_ACCELERATOR_SSO_PEER_AUTHORIZE_URL:-https://api.blog.1zyq1.com/api/sso/authorize}
      GITHUB_ACCELERATOR_SSO_PEER_CALLBACK_URL: ${GITHUB_ACCELERATOR_SSO_PEER_CALLBACK_URL:-https://api.blog.1zyq1.com/api/sso/callback}
      GITHUB_ACCELERATOR_SSO_SELF_CALLBACK_URL: ${GITHUB_ACCELERATOR_SSO_SELF_CALLBACK_URL:-}
      GITHUB_ACCELERATOR_SSO_ASSERTION_TTL_SECONDS: ${GITHUB_ACCELERATOR_SSO_ASSERTION_TTL_SECONDS:-300}
    volumes:
      - accelerator-cache:/app/.cache
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  accelerator-cache:
